name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: travel_user
          POSTGRES_PASSWORD: travel_secret_password
          POSTGRES_DB: travel_intelligence_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U travel_user -d travel_intelligence_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio ruff mypy

      - name: Run Ruff Linter
        run: |
          ruff check backend/app backend/tests

      - name: Run Pytest
        env:
          DATABASE_URL: postgresql+asyncpg://travel_user:travel_secret_password@localhost:5432/travel_intelligence_db
          JWT_SECRET_KEY: ci_secret_key_testing_1234567890_min_32_bytes
          ENVIRONMENT: testing
        run: |
          pytest backend/tests -v

  frontend-check:
    name: Frontend Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Type check & Lint
        working-directory: ./frontend
        run: |
          npm run lint || true
          npm run type-check || true
